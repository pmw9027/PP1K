<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmarket Clone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #00c73c;
      padding: 10px;
      color: white;
      display: flex;
      align-items: center;
    }

    header input {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: none;
      margin-left: 10px;
    }

    .banner {
      width: 100%;
      height: 150px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu {
      display: flex;
      overflow-x: auto;
      background: white;
      padding: 10px 0;
    }

    .menu div {
      flex: 0 0 auto;
      margin: 0 10px;
      text-align: center;
      font-size: 12px;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .product {
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .product img {
      width: 100%;
      border-radius: 5px;
    }

    .price {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div>Gmarket</div>
  <input type="text" placeholder="검색어를 입력하세요">
</header>

<div class="banner">
  메인 배너 영역
</div>

<div class="menu">
  <div>패션</div>
  <div>뷰티</div>
  <div>식품</div>
  <div>가전</div>
  <div>여행</div>
</div>

<div class="products">
  <div class="product">
    <img src="https://via.placeholder.com/150">
    <div>상품 이름</div>
    <div class="price">₩9,900</div>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/150">
    <div>상품 이름</div>
    <div class="price">₩12,900</div>
  </div>
</div>

</body>
</html>
