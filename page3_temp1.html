<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmarket IP Partner - Factory & Trend Matching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .header-gradient {
            background: linear-gradient(135deg, #43a047 0%, #1e88e5 100%);
            opacity: 0.9;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">

    <div class="w-[375px] h-[812px] bg-white shadow-2xl rounded-[40px] overflow-hidden border-[8px] border-black relative flex flex-col">
        
        <div class="px-6 pt-4 flex justify-between items-center text-xs font-bold bg-white">
            <span>9:41</span>
            <div class="flex gap-1">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <div class="py-4 flex justify-center items-center border-b border-gray-100 bg-white">
            <h1 class="text-lg font-bold">
                <span class="text-green-500">G</span>market <span class="text-blue-600">IP Partner</span>
            </h1>
        </div>

        <div class="flex-1 overflow-y-auto bg-gray-50">
            <div class="header-gradient p-6 text-center text-white">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-2">
                    <i class="fa-solid fa-check text-xl"></i>
                </div>
                <h2 class="text-xl font-bold">제조공장 및 트렌드 매칭 성공!</h2>
            </div>

            <div class="p-4 grid grid-cols-2 gap-3 -mt-4">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                    <div class="p-3 bg-gray-50 border-b border-gray-100">
                        <p class="text-[11px] font-bold text-gray-700 text-center">매칭된 제조공장</p>
                    </div>
                    <div class="p-3 flex-1 flex flex-col items-center">
                        <div class="w-full h-20 bg-gray-200 rounded-lg mb-2 overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=300" alt="Factory" class="w-full h-full object-cover">
                        </div>
                        <p class="text-[10px] font-bold text-gray-800 text-center">Factory A (김지훈 공장장)</p>
                        <ul class="text-[8px] text-gray-500 mt-2 list-disc pl-3">
                            <li>현대식 자동화 라인</li>
                            <li>위생 표준 준수</li>
                        </ul>
                        <button class="mt-3 w-full border border-gray-200 py-1 rounded text-[9px] font-bold text-gray-600">공장 상세 보기</button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                    <div class="p-3 bg-gray-50 border-b border-gray-100">
                        <p class="text-[11px] font-bold text-gray-700 text-center">최신 트렌드 분석</p>
                    </div>
                    <div class="p-3 flex-1 flex flex-col items-center">
                        <div class="w-full h-20 bg-blue-50 rounded-lg mb-2 flex flex-col items-center justify-center p-2">
                            <i class="fa-solid fa-chart-line text-blue-500 text-xl mb-1"></i>
                            <p class="text-[8px] font-bold text-blue-600">전통의 표준화</p>
                        </div>
                        <p class="text-[10px] font-bold text-gray-800 text-center">주체: 전통 국밥 표준화</p>
                        <ul class="text-[8px] text-gray-500 mt-2 list-disc pl-3">
                            <li>1인 가구 타겟 패키징</li>
                            <li>IP 기반 브랜드 전략</li>
                        </ul>
                        <button class="mt-3 w-full border border-gray-200 py-1 rounded text-[9px] font-bold text-gray-600">분석 보고서 보기</button>
                    </div>
                </div>
            </div>

            <div class="px-8 py-6">
                <div class="flex justify-between text-[10px] text-gray-400 mb-2">
                    <span>컨설팅 신청</span>
                    <span class="text-blue-600 font-bold">매칭 완료</span>
                </div>
                <div class="w-full bg-gray-200 h-1 rounded-full relative">
                    <div class="absolute left-0 top-0 h-full w-full bg-blue-600 rounded-full"></div>
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-blue-600 rounded-full border-2 border-white"></div>
                </div>
            </div>
        </div>

        <div class="px-4 py-3 bg-white">
            <button class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold text-sm shadow-md hover:bg-green-700">
                공장 컨택 및 채팅 시작하기
            </button>
        </div>

        <div class="sticky bottom-0 border-t border-gray-100 px-6 pt-3 pb-8 flex justify-between items-center bg-white">
            <div class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1">홈</span>
            </div>
            <div class="flex flex-col items-center text-blue-600 font-bold">
                <i class="fa-solid fa-clipboard-check text-lg"></i>
                <span class="text-[10px] mt-1">등록관리</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="text-[10px] mt-1">마이페이지</span>
            </div>
        </div>

        <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-black rounded-full"></div>
    </div>

</body>
</html>
