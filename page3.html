<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 쇼핑 UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: start; pt-10; }
        .dynamic-island {
            width: 125px;
            height: 36px;
            background-color: black;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }
    </style>
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .gradient-banner {
            background: linear-gradient(135deg, #0a4d2c 0%, #16a34a 60%, #eab308 100%);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">
    <div class="w-[375px] h-[812px] bg-white shadow-2xl rounded-[40px] overflow-hidden border-[8px] border-black relative flex flex-col">
        
        <div class="px-6 pt-4 flex justify-between items-center text-xs font-bold">
            <span>9:41</span>
            <div class="flex gap-1">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <div class="py-4 flex justify-center items-center border-b border-gray-100">
            <h1 class="text-lg font-bold">
                <span class="text-green-500">G</span>market <span class="text-blue-600">IP Partner</span>
            </h1>
        </div>

        <div class="bg-gray-50 px-4 py-4">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-gray-700">단계 1/2</span>
            </div>
            <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full w-2/4"></div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3">
            
            
        </div>

        <div class="border-t border-gray-100 px-6 py-3 flex justify-between items-center bg-white mb-6">
            <div class="flex flex-col items-center text-blue-600">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-bold">홈</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-clipboard-check text-lg"></i>
                <span class="text-[10px] mt-1">등록관리</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
                <i class="fa-regular fa-user text-lg"></i>
                <span class="text-[10px] mt-1">마이페이지</span>
            </div>
        </div>

        <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-black rounded-full"></div>
    </div>

</body>
</html>
