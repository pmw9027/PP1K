<!DOCTYPE html>
<html lang="ko">
<head>

    <title>Gmarket IP Partner UI</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

<body class="flex justify-center items-center min-h-screen">

    <div class="w-[375px] h-[812px] bg-white shadow-2xl rounded-[40px] overflow-hidden border-[8px] border-black relative flex flex-col">

                                <p class="text-[12px] font-bold">남경회관_부산</p>
                                <p class="text-[10px] text-gray-400">상태: 등록 완료</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold">등록 완료</span>
                            <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                        </div>
                    </div>

                            <div>

                        <div class="flex items-center gap-2">

                            <div>

                    <div class="flex items-center justify-between pb-4">

                            <div>
                                <p class="text-[12px] font-bold">해빔_꽃게살비빔밥</p>
                                <p class="text-[10px] text-gray-400">상태: 심사 중</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">

                            <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pb-4">

                            <div class="w-10 h-10 border rounded flex items-center justify-center font-bold text-green-600">G</div>
                            <div>
                                <p class="text-[12px] font-bold">해빔_꽃게살비빔밥</p>
                                <p class="text-[10px] text-gray-400">상태: 심사 중</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] bg-yellow-100 text-yellow-600 px-2 py-0.5 rounded-full font-bold">심사 중</span>
                            <i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="border-t border-gray-100 px-6 py-3 flex justify-between items-center bg-white mb-6">
            <div class="flex flex-col items-center text-gray-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-bold">홈</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
